name: OrangeFox - Matrix Build

# Builds several devices from one unified device tree in parallel (one runner
# per device) and uploads every image to a single release.

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICES:
        description: 'Device codenames to build (space or comma separated)'
        required: true
        default: 'mayfly cupid zeus unicorn'
      DEVICE_TREE:
        description: 'Unified Device Tree'
        required: true
        default: 'https://github.com/dopaemon/TWRP-device_xiaomi_sm8475'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'fox_12.1-6.6'
      DEVICE_PATH:
        description: 'Path the device tree is cloned to (each codename is symlinked to it)'
        required: true
        default: 'device/xiaomi/sm8450-common'
      RECOVERY_REPO:
        description: 'Custom bootable/recovery repository (leave empty to keep the synced one)'
        required: false
        default: 'https://github.com/dopaemon/orangefox_bootable_recovery'
      RECOVERY_BRANCH:
        description: 'Custom bootable/recovery branch'
        required: false
        default: 'fox_12.1'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

env:
  RELEASE_TAG: ${{ github.run_id }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare matrix and release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      devices: ${{ steps.matrix.outputs.devices }}
    env:
      DEVICES: ${{ inputs.DEVICES }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      RECOVERY_REPO: ${{ inputs.RECOVERY_REPO }}
      RECOVERY_BRANCH: ${{ inputs.RECOVERY_BRANCH }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
    steps:
    - name: Build the device matrix
      id: matrix
      run: |
        devices=$(printf '%s' "$DEVICES" | tr ', ' '\n\n' | grep -E '^[A-Za-z0-9_-]+$' | sort -u | jq -R . | jq -sc .)
        if [ "$devices" = "[]" ] || [ -z "$devices" ]; then
          echo "No valid device codenames in DEVICES" >&2
          exit 1
        fi
        echo "devices=$devices" >> "$GITHUB_OUTPUT"
        echo "Devices: $devices"

    # The release is created once here, so the parallel build jobs only add
    # assets to it and cannot race each other creating it.
    - name: Create the release
      run: |
        tree_url="${DEVICE_TREE%.git}"
        tree_commit=$(git ls-remote "$DEVICE_TREE" "refs/heads/$DEVICE_TREE_BRANCH" | cut -f1)
        {
          echo "## OrangeFox Recovery Build - Unofficial"
          echo "Build: fox_${MANIFEST_BRANCH}"
          echo "Devices: $(printf '%s' "$DEVICES" | tr ',' ' ')"
          echo "Device tree: [${DEVICE_TREE_BRANCH}](${tree_url}/tree/${DEVICE_TREE_BRANCH}) at [${tree_commit:0:10}](${tree_url}/commit/${tree_commit})"
          if [ -n "$RECOVERY_REPO" ]; then
            rec_url="${RECOVERY_REPO%.git}"
            rec_commit=$(git ls-remote "$RECOVERY_REPO" "refs/heads/$RECOVERY_BRANCH" | cut -f1)
            echo "Recovery source: [${RECOVERY_BRANCH}](${rec_url}/tree/${RECOVERY_BRANCH}) at [${rec_commit:0:10}](${rec_url}/commit/${rec_commit})"
          fi
        } > notes.md
        gh release create "$RELEASE_TAG" \
          --target "$GITHUB_SHA" \
          --title "OrangeFox Recovery // $(TZ=Asia/Ho_Chi_Minh date +%Y%m%d)" \
          --notes-file notes.md

  build:
    name: Build ${{ matrix.device }}
    needs: prepare
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.prepare.outputs.devices) }}
    env:
      DEVICE: ${{ matrix.device }}
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      RECOVERY_REPO: ${{ inputs.RECOVERY_REPO }}
      RECOVERY_BRANCH: ${{ inputs.RECOVERY_BRANCH }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
    steps:
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
        cd "${GITHUB_WORKSPACE}/OrangeFox"
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch "${MANIFEST_BRANCH}" --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}"
        echo "FOX_ROOT=${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}" >> "$GITHUB_ENV"

    - name: Replace bootable/recovery
      if: inputs.RECOVERY_REPO != ''
      run: |
        cd "$FOX_ROOT"
        rm -rf bootable/recovery
        git clone --depth 1 "$RECOVERY_REPO" -b "$RECOVERY_BRANCH" bootable/recovery

    - name: Clone Device Tree
      run: |
        cd "$FOX_ROOT"
        git clone --depth 1 "$DEVICE_TREE" -b "$DEVICE_TREE_BRANCH" "./$DEVICE_PATH"
        # The unified tree is found under the codename through a symlink
        if [ "$(basename "$DEVICE_PATH")" != "$DEVICE" ]; then
          ln -sfn "$(basename "$DEVICE_PATH")" "$(dirname "$DEVICE_PATH")/$DEVICE"
        fi
        # Dependency of the device tree's boot control HAL
        if [ ! -d hardware/qcom-caf/bootctrl ]; then
          git clone --depth 1 -b lineage-21.0-caf \
            https://github.com/LineageOS/android_hardware_qcom_bootctrl hardware/qcom-caf/bootctrl
        fi

    - name: Building OrangeFox
      run: |
        cd "$FOX_ROOT"
        set +e
        # The Soong sandbox (nsjail) does not work on the hosted runners
        sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch "twrp_${DEVICE}-eng" && make clean && mka adbd "${BUILD_TARGET}image"

    - name: Upload to Release
      run: |
        # Some checkouts nest the product directory once more under out/, so search for it
        mapfile -t files < <(find "$FOX_ROOT/out/target/product/$DEVICE" -maxdepth 4 -type f \
          \( -name 'OrangeFox*.img' -o -name 'OrangeFox*.zip' \) | sort)
        if [ ${#files[@]} -eq 0 ]; then
          echo "No OrangeFox image was produced for $DEVICE" >&2
          exit 1
        fi
        # Keep the assets apart when a file name does not carry the codename
        mkdir -p "$RUNNER_TEMP/assets"
        for f in "${files[@]}"; do
          name=$(basename "$f")
          case "$name" in
            *"$DEVICE"*) ;;
            *) name="${name%.*}-${DEVICE}.${name##*.}" ;;
          esac
          cp "$f" "$RUNNER_TEMP/assets/$name"
        done
        ls -la "$RUNNER_TEMP/assets"
        gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/assets/* --clobber

  finish:
    name: Check the release
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    # Do not leave an empty release behind when every device failed
    - name: Remove the release if nothing was uploaded
      run: |
        count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
        echo "Release $RELEASE_TAG has $count asset(s)"
        if [ "$count" -eq 0 ]; then
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag
        fi
